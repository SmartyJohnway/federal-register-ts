name: Release Engineering & Supply-Chain Validation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Execute in dry-run mode (MUST be true in R3-05)'
        type: boolean
        required: true
        default: true
      target_version:
        description: 'Target release version (e.g., 1.0.0-rc.1 or 1.0.0)'
        type: string
        required: true
        default: '1.0.0'
      dist_tag:
        description: 'npm distribution tag (latest, rc, next)'
        type: choice
        options:
          - rc
          - next
          - latest
        required: true
        default: 'rc'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-pack:
    name: Validate & Dry-Run Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC token minting & provenance attestation
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Validate release candidate metadata
        run: |
          node scripts/release/verify-release-candidate.js \
            --target-version "${{ inputs.target_version }}" \
            --dist-tag "${{ inputs.dist_tag }}"

      - name: Pack release tarball
        run: npm pack

      - name: Audit release tarball
        run: node scripts/release/audit-tarball.js

      - name: Test non-publishing dry-run publish
        run: |
          npm publish --dry-run --tag "${{ inputs.dist_tag }}"

      - name: Enforce R3-05 zero-publish safety invariant
        run: |
          echo "=== R3-05 SAFETY INVARIANT ATTESTATION ==="
          echo "Live npm publication is STRICTLY FORBIDDEN in milestone R3-05."
          echo "Inputs validated: version=${{ inputs.target_version }}, dist-tag=${{ inputs.dist_tag }}, dry_run=${{ inputs.dry_run }}."
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "CRITICAL ERROR: dry_run must be true in R3-05. Live publication is gated for R3-07/R3-08."
            exit 1
          fi
          echo "Safety invariant check: PASS (dry-run only verified)."
