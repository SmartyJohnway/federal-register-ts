name: Release Engineering & Supply-Chain Validation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Execute in dry-run mode (MUST be true in R3-05)'
        type: boolean
        required: true
        default: true
      target_version:
        description: 'Target release version (e.g., 1.0.0-rc.1 or 1.0.0)'
        type: string
        required: true
        default: '1.0.0'
      dist_tag:
        description: 'npm distribution tag (latest, rc, next)'
        type: choice
        options:
          - rc
          - next
          - latest
        required: true
        default: 'rc'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-pack:
    name: Validate & Dry-Run Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce R3-05 zero-publish safety invariant
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "CRITICAL ERROR: dry_run must be true in R3-05."
          echo "Live npm publication is STRICTLY FORBIDDEN in milestone R3-05."
          echo "Live stage/publish is gated for future R3-07/R3-08."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js 22 (no cache — release hardening)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Record release toolchain identity
        run: |
          echo "=== Release Toolchain Identity ==="
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Validate release candidate metadata
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node scripts/release/verify-release-candidate.js \
            --target-version "$TARGET_VERSION" \
            --dist-tag "$DIST_TAG"

      - name: Pack release tarball (exact binding)
        id: pack
        run: |
          PACK_OUTPUT=$(npm pack --json)
          TARBALL_NAME=$(echo "$PACK_OUTPUT" | node -e "
            const chunks = [];
            process.stdin.on('data', c => chunks.push(c));
            process.stdin.on('end', () => {
              const data = JSON.parse(chunks.join(''));
              console.log(Array.isArray(data) ? data[0].filename : data.filename);
            });
          ")
          echo "tarball_name=$TARBALL_NAME" >> "$GITHUB_OUTPUT"
          echo "=== Exact Tarball Binding ==="
          echo "Filename: $TARBALL_NAME"

      - name: Audit release tarball
        env:
          TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
        run: node scripts/release/audit-tarball.js "$TARBALL_NAME"

      - name: Test non-publishing dry-run publish
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          npm publish --dry-run --tag "$DIST_TAG"

      - name: Clean transient tarball artifact
        env:
          TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
        run: |
          if [ -n "$TARBALL_NAME" ] && [ -f "$TARBALL_NAME" ]; then
            rm -f "$TARBALL_NAME"
            echo "Cleaned transient tarball: $TARBALL_NAME"
          fi
