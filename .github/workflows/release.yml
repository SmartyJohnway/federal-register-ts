name: Release & Staged Publishing

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target release version (must be 1.1.0-rc.1)'
        type: string
        required: true
        default: '1.1.0-rc.1'
      dist_tag:
        description: 'npm distribution tag (must be rc)'
        type: choice
        options:
          - rc
        required: true
        default: 'rc'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-pack:
    name: Validate & Pack RC Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
      tarball_sha256: ${{ steps.audit.outputs.tarball_sha256 }}
    steps:
      - name: Enforce strict R3-POSTGA-02-D release parameters
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if [ "$TARGET_VERSION" != "1.1.0-rc.1" ] || [ "$DIST_TAG" != "rc" ]; then
            echo "CRITICAL ERROR: R3-POSTGA-02-D only authorizes target_version=1.1.0-rc.1 and dist_tag=rc."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js 22 (no cache — release hardening)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Pin frozen release npm CLI
        run: npm install --global npm@11.19.1

      - name: Verify frozen release toolchain
        shell: bash
        run: |
          echo "=== Release Toolchain Identity ==="
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          if [ "$(npm --version)" != "11.19.1" ]; then
            echo "CRITICAL ERROR: frozen release CLI requires npm 11.19.1"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Validate release candidate metadata
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node scripts/release/verify-release-candidate.js \
            --target-version "$TARGET_VERSION" \
            --dist-tag "$DIST_TAG"

      - name: Pack release tarball (exact binding)
        id: pack
        run: |
          PACK_OUTPUT=$(npm pack --json)
          TARBALL_NAME=$(echo "$PACK_OUTPUT" | node -e "
            const chunks = [];
            process.stdin.on('data', c => chunks.push(c));
            process.stdin.on('end', () => {
              const data = JSON.parse(chunks.join(''));
              console.log(Array.isArray(data) ? data[0].filename : data.filename);
            });
          ")
          echo "tarball_name=$TARBALL_NAME" >> "$GITHUB_OUTPUT"
          echo "=== Exact Tarball Binding ==="
          echo "Filename: $TARBALL_NAME"

      - name: Audit release tarball
        id: audit
        env:
          TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
        run: |
          node scripts/release/audit-tarball.js "$TARBALL_NAME"
          SHA256_HASH=$(sha256sum "$TARBALL_NAME" | cut -d ' ' -f 1)
          echo "tarball_sha256=$SHA256_HASH" >> "$GITHUB_OUTPUT"
          if [ "$SHA256_HASH" != "e712fc2a2a311bff0ae8734991f7911488727028ad114f31e96d9a5a9b5ca2f1" ]; then
            echo "CRITICAL ERROR: Tarball SHA-256 does not match frozen RC artifact!"
            exit 1
          fi

      - name: Upload validated tarball artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-tarball
          path: ${{ steps.pack.outputs.tarball_name }}
          if-no-files-found: error
          retention-days: 1

  stage-publish:
    name: OIDC Staged Publish (npm-release)
    needs: validate-and-pack
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js 22 (no cache — release hardening)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Pin frozen release npm CLI
        run: npm install --global npm@11.19.1

      - name: Verify frozen release toolchain
        shell: bash
        run: |
          echo "=== Release Toolchain Identity ==="
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          if [ "$(npm --version)" != "11.19.1" ]; then
            echo "CRITICAL ERROR: frozen release CLI requires npm 11.19.1"
            exit 1
          fi

      - name: Download validated tarball artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-tarball

      - name: Verify downloaded tarball integrity
        env:
          EXPECTED_SHA256: "e712fc2a2a311bff0ae8734991f7911488727028ad114f31e96d9a5a9b5ca2f1"
        run: |
          TARBALL="federal-register-ts-1.1.0-rc.1.tgz"
          if [ ! -f "$TARBALL" ]; then
            echo "CRITICAL ERROR: Tarball not found!"
            exit 1
          fi
          ACTUAL_SHA256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)
          echo "Actual SHA256:   $ACTUAL_SHA256"
          echo "Expected SHA256: $EXPECTED_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "CRITICAL ERROR: Downloaded tarball SHA-256 mismatch!"
            exit 1
          fi
          echo "Tarball integrity verified."

      - name: Execute OIDC Staged Publish
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          echo "=== Executing npm stage publish via OIDC ==="
          npm stage publish ./federal-register-ts-1.1.0-rc.1.tgz \
            --tag "$DIST_TAG" \
            --registry=https://registry.npmjs.org/
